# Customer install template — fill KV id after creating the namespace (see README).
name = "relaybase-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
WORKER_SCRIPT_NAME = "relaybase-api"
INBOUND_BUCKET_NAME = "relaybase-inbound"

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "RELAYBASE_APP"
id = "REPLACE_WITH_relaybase-app_ID"

[[r2_buckets]]
binding = "INBOUND"
bucket_name = "relaybase-inbound"
