name: Team invite
description: Accept to join the workspace — you do not need to reconnect DNS
subject: "{{trigger.inviterName}} invited you to {{trigger.workspaceName}}"
previewText: Accept to join the workspace — you do not need to reconnect DNS
bodyMarkdown: |
  Hi {{contact.name}},

  **{{trigger.inviterName}}** invited you to the **{{trigger.workspaceName}}** workspace on Relaybase.

   

  This link expires in **{{trigger.expiresInDays}} days**. After you accept, you can send from the workspace domain and see the same audience groups — you do not need to reconnect DNS.

  If you were not expecting this, you can ignore the email. Nobody is added to the workspace until you click.

  Questions? Reply and we will loop in {{trigger.inviterName}}.

  — Relaybase
