name: relaybase
description: Relaybase mobile email companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (matches the sayso reference app).
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Offline cache.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking.
  http: ^1.2.2

  # Secrets (mobile password + Worker URL).
  flutter_secure_storage: ^9.2.2

  # QR pairing.
  mobile_scanner: ^5.2.3

  # HTML rendering for email bodies.
  flutter_widget_from_html: ^0.15.3

  # Utilities.
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
