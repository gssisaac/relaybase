id: tpl-dark-obsidian
name: Dark Obsidian
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#121316;border:1px solid #27272a;border-radius:12px;overflow:hidden;">
        <tr><td style="padding:20px 28px;border-bottom:1px solid #27272a;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:middle;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td data-scale-header-logo="1" style="vertical-align:middle;padding-right:12px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                    <td style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;font-weight:600;color:#fafafa;line-height:1.3;">
                      {{vars.brand.organization_name}}
                    </td>
                  </tr>
                </table>
              </td>
              <td align="right" style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#a1a1aa;">
                {{vars.header.badge_text}}
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e4e4e7;font-size:15px;line-height:1.65;">
          <div style="color:#e4e4e7;font-size:15px;line-height:1.65;">{{content}}</div>
        </td></tr>
        <tr>
          <td style="padding:24px 28px;text-align:center;font-size:12px;color:#a1a1aa;line-height:1.6;border-top:1px solid #27272a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 12px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:13px;font-weight:600;color:#a1a1aa;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 10px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 14px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#a1a1aa;text-decoration:underline;">Unsubscribe</a>
              from this type of email.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the header and footer. Uses the Relaybase icon when unset.
    - key: header.badge_text
      type: text
      label: Header badge
      description: Short label in the top-right (e.g. Release note, Changelog).
