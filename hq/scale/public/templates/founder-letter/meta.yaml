id: tpl-founder-letter
name: Founder Letter
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafaf9;">
    <tr><td align="center" style="padding:40px 16px;">
      <table role="presentation" width="580" cellpadding="0" cellspacing="0" style="max-width:580px;width:100%;background:#ffffff;border:1px solid #e7e5e4;border-radius:12px;overflow:hidden;">
        <tr><td style="padding:28px 32px 20px;border-bottom:1px solid #f5f5f4;">
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:middle;padding-right:12px;line-height:0;font-size:0;">
                {{vars.author.avatar}}
              </td>
              <td style="vertical-align:middle;">
                <p style="margin:0 0 2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;font-weight:600;color:#1c1917;line-height:1.2;">
                  {{vars.author.name}}
                </p>
                <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;color:#78716c;line-height:1.3;">
                  {{vars.author.title}}
                </p>
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;color:#292524;font-size:15px;line-height:1.75;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:24px 32px;text-align:center;font-size:12px;color:#78716c;line-height:1.6;border-top:1px solid #f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 10px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:12px;font-weight:600;color:#57534e;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 8px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 10px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#78716c;text-decoration:underline;">Unsubscribe</a>
              from personal founder notes.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: author.name
      type: text
      label: Author name
      required: true
      defaultFrom: compliance.organizationName
      description: Name of the sender (e.g. Alex River).
    - key: author.title
      type: text
      label: Author title / role
      description: Subtitle under author name (e.g. Founder & CEO).
    - key: author.avatar
      type: image
      label: Author photo / avatar
      description: Small 44px circular avatar next to the name.
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the footer. Uses the Relaybase icon when unset.
