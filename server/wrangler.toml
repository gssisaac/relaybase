name = "relaybase-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
account_id = "3adf03d991843094a7343eebc0a98007"

# Isaac personal dogfood Worker. The api.relaybase.xyz custom domain was removed;
# this Worker now runs on its default workers.dev URL (relaybase-api.gssisaac.worker.dev).
# Central account/auth/billing/license/recovery live in the separate console.relaybase.xyz
# Next.js app (see console/). This Worker only serves mail/console/mobile/v1 product routes.

[vars]
WORKER_SCRIPT_NAME = "relaybase-api"
INBOUND_BUCKET_NAME = "relaybase-mailbox"

# Audience group data-source sync (single catalog — no per-user fan-out).
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "RELAYBASE_APP"
# Was previously bound as KEYS (same namespace id — rename only).
id = "341bf6e6f3c943a8a4f73128a98eb795"
preview_id = "fe42e6d5f04741f7a09516f25504581a"

[[r2_buckets]]
binding = "INBOUND"
bucket_name = "relaybase-mailbox"

[[d1_databases]]
binding = "RELAYBASE_LOGS"
database_name = "relaybase-logs"
database_id = "ceea55c5-04cd-4501-846e-0ea62971f8e9"
migrations_dir = "migrations-logs"

# Inbound mail full-text search (FTS5). Before deploying, create the DB with:
#   wrangler d1 create relaybase-inbox-index
# paste the returned database_id below, then run:
#   wrangler d1 migrations apply relaybase-inbox-index --remote
#   node scripts/backfill-inbound-search.mjs   # one-time backfill
# The binding is optional in code (Env.RELAYBASE_INBOX_INDEX?) — without it,
# search endpoints return 503 and ingest skips indexing.
[[d1_databases]]
binding = "RELAYBASE_INBOX_INDEX"
database_name = "relaybase-inbox-index"
database_id = "bef720aa-950f-4a66-928e-155efcc5c64a"
migrations_dir = "migrations-inbox"
