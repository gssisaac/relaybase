id: tpl-spotlight-minimal
name: Spotlight Minimal
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;">
    <tr><td align="center" style="padding:36px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:2px solid #18181b;">
        <tr><td style="padding:16px 24px;border-bottom:2px solid #18181b;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:middle;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td data-scale-header-logo="1" style="vertical-align:middle;padding-right:10px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                    <td style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;font-weight:800;letter-spacing:-0.03em;text-transform:uppercase;color:#18181b;line-height:1.2;">
                      {{vars.brand.organization_name}}
                    </td>
                  </tr>
                </table>
              </td>
              <td align="right" style="vertical-align:middle;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#18181b;white-space:nowrap;">
                {{vars.spotlight.issue}}
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:8px 24px;background:#f4f4f5;border-bottom:1px solid #18181b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#52525b;line-height:1.3;">
          {{vars.spotlight.tagline}}
        </td></tr>
        <tr><td style="padding:32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18181b;font-size:15px;line-height:1.65;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:24px;text-align:center;font-size:11px;color:#71717a;line-height:1.6;border-top:2px solid #18181b;background:#fafafa;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 10px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:12px;font-weight:700;color:#18181b;line-height:1.3;text-align:left;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 6px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 8px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#18181b;font-weight:600;text-decoration:underline;">Unsubscribe</a>
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: spotlight.issue
      type: text
      label: Issue badge
      description: Top-right issue indicator (e.g. NO. 08 / VOL. 3).
    - key: spotlight.tagline
      type: text
      label: Top tagline
      description: Sub-header marquee tagline (e.g. CURATED SIGNALS & DISPATCHES).
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the header and footer. Uses the Relaybase icon when unset.
