id: tpl-keynote-banner
name: Keynote Banner
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000000;">
    <tr><td align="center" style="padding:32px 16px 48px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#000000;">
        <tr>
          <td align="center" style="padding:0 0 32px;line-height:0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 30%,#6366f1 60%,#a855f7 85%,#ec4899 100%);">
              <tr>
                <td align="center" style="padding:0;min-height:180px;">
                  {{vars.hero.image}}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr><td style="padding:0 12px 24px;text-align:center;">
          <h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.03em;color:#ffffff;line-height:1.3;">
            {{vars.event.headline}}
          </h1>
        </td></tr>
        <tr><td style="padding:0 12px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e4e4e7;font-size:15px;line-height:1.7;">
          <div style="color:#e4e4e7;font-size:15px;line-height:1.7;">{{content}}</div>
        </td></tr>
        <tr>
          <td style="padding:28px 12px 0;text-align:center;font-size:12px;color:#71717a;line-height:1.6;border-top:1px solid #27272a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 12px;">
              <tr>
                <td data-studio-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:13px;font-weight:600;color:#a1a1aa;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 10px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 14px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#a1a1aa;text-decoration:underline;">Unsubscribe</a>
              from keynote and event announcements.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: hero.image
      type: image
      label: Hero banner image
      description: Large rounded 16:9 banner image. Glowing gradient shows when unset.
    - key: event.headline
      type: text
      label: Keynote headline
      required: true
      defaultFrom: compliance.organizationName
      description: Prominent bold title centered below the hero banner.
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the footer. Uses the Relaybase icon when unset.
