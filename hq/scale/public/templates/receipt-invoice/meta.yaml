id: tpl-receipt-invoice
name: Receipt / Invoice
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
    <tr><td align="center" style="padding:36px 16px;">
      <table role="presentation" width="580" cellpadding="0" cellspacing="0" style="max-width:580px;width:100%;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;">
        <tr><td style="padding:28px 32px 20px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:middle;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td data-scale-header-logo="1" style="vertical-align:middle;padding-right:10px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                    <td style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;font-weight:700;color:#18181b;line-height:1.2;">
                      {{vars.receipt.title}}
                    </td>
                  </tr>
                </table>
              </td>
              <td align="right" style="vertical-align:middle;">
                <span style="display:inline-block;padding:4px 10px;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;font-weight:600;color:#52525b;letter-spacing:0.02em;">
                  {{vars.receipt.number}}
                </span>
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 32px;"><div style="border-top:2px dashed #e4e4e7;height:1px;line-height:1px;font-size:0;">&nbsp;</div></td></tr>
        <tr><td style="padding:28px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#27272a;font-size:14px;line-height:1.6;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:24px 32px;text-align:center;font-size:12px;color:#71717a;line-height:1.6;border-top:1px solid #f4f4f5;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 10px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:12px;font-weight:600;color:#52525b;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 8px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 10px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#71717a;text-decoration:underline;">Unsubscribe</a>
              from billing and account notices.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: receipt.title
      type: text
      label: Receipt title
      required: true
      defaultFrom: compliance.organizationName
      description: Main header text (e.g. Payment Receipt, Order Summary).
    - key: receipt.number
      type: text
      label: Reference / Invoice #
      description: Reference ID badge shown top-right (e.g. INV-2026-0901).
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in header and footer. Uses the Relaybase icon when unset.
