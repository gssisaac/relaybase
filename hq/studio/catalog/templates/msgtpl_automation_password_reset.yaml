subject: Reset your Relaybase password
previewText: This link expires soon and can be used once
bodyMarkdown: |-
  Hi {{contact.name}},

  We received a request to reset the password for **{{contact.email}}**.

  [Reset your password]({{trigger.resetUrl}})

  This link expires in **{{trigger.expiresInMinutes}} minutes** and can be used once. If the button does not work, paste this URL:

  {{trigger.resetUrl}}

  If you did not ask for a reset, you can ignore this message — your current password stays the same. Someone may have typed your address by mistake.

  We will never ask you to forward this email or paste the link into a chat, ticket, or “support” form.

  — Relaybase Security
