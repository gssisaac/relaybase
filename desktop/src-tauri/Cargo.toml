[package]
name = "relaybase_desktop"
version = "0.1.0"
description = "Relaybase desktop application"
authors = ["Relaybase"]
edition = "2021"
rust-version = "1.77.2"
# Dock / process name under `tauri dev` comes from the binary filename.
autobins = false

[[bin]]
name = "Relaybase"
path = "src/main.rs"

[lib]
name = "relaybase_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
url = "2"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "io-std"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
thiserror = "2"
notify-rust = "4"
open = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-biometry = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
