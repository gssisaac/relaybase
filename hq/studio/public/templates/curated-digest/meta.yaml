id: tpl-curated-digest
name: Curated Digest
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#edf2f7;">
    <tr><td align="center" style="padding:36px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="height:4px;line-height:4px;font-size:0;background:#4f46e5;">&nbsp;</td></tr>
        <tr><td style="padding:20px 28px 16px;border-bottom:1px solid #e2e8f0;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#0f172a;line-height:1.2;">
                {{vars.digest.title}}
              </td>
              <td align="right" style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;font-weight:500;color:#64748b;line-height:1.3;white-space:nowrap;">
                {{vars.digest.read_time}}
              </td>
            </tr>
            <tr><td colspan="2" style="padding-top:6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;color:#94a3b8;line-height:1.4;">
              {{vars.digest.edition}}
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#334155;font-size:15px;line-height:1.65;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:24px 28px;text-align:center;font-size:12px;color:#64748b;line-height:1.6;border-top:1px solid #e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 12px;">
              <tr>
                <td data-studio-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:13px;font-weight:600;color:#334155;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 10px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 14px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#64748b;text-decoration:underline;">Unsubscribe</a>
              from this type of email.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: digest.title
      type: text
      label: Digest title
      required: true
      defaultFrom: compliance.organizationName
    - key: digest.read_time
      type: text
      label: Read time
      description: Shown top-right (e.g. 4 min read).
    - key: digest.edition
      type: text
      label: Edition line
      description: Subtitle under the title (e.g. Weekly edition #14).
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the footer. Uses the Relaybase icon when unset.
