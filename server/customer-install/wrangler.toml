# Customer install template — fill KV id after creating the namespace (see README).
name = "relaybase-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
WORKER_SCRIPT_NAME = "relaybase-api"
INBOUND_BUCKET_NAME = "relaybase-mailbox"

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "RELAYBASE_APP"
id = "REPLACE_WITH_relaybase-app_ID"

[[r2_buckets]]
binding = "INBOUND"
bucket_name = "relaybase-mailbox"

# Optional — hosted-only product ops logs. Omit if you don't need dashboard Logs.
# [[d1_databases]]
# binding = "RELAYBASE_LOGS"
# database_name = "relaybase-logs"
# database_id = "REPLACE_WITH_relaybase-logs_ID"
# migrations_dir = "migrations-logs"
