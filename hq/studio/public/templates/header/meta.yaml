id: tpl-header
name: Header
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="padding:20px 32px;border-bottom:1px solid #e2e8f0;">
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
              <td data-studio-header-logo="1" style="vertical-align:middle;padding-right:12px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
              <td style="vertical-align:middle;font-family:sans-serif;font-size:18px;font-weight:600;color:#0f172a;line-height:1.3;">
                {{vars.brand.organization_name}}
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:32px;font-family:sans-serif;color:#0f172a;font-size:15px;line-height:1.6;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:28px 32px;text-align:center;font-size:12px;color:#64748b;line-height:1.6;border-top:1px solid #e2e8f0;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 12px;">
              <tr>
                <td data-studio-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-family:sans-serif;font-size:13px;font-weight:600;color:#334155;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 10px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 14px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#64748b;text-decoration:underline;">Unsubscribe</a>
              from this type of email.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the header and footer. Uses the Relaybase icon when unset.
