id: tpl-editorial-serif
name: Editorial Serif
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f9fa;">
    <tr><td align="center" style="padding:36px 16px;">
      <table role="presentation" width="620" cellpadding="0" cellspacing="0" style="max-width:620px;width:100%;background:#ffffff;border:1px solid #e5e7eb;">
        <tr><td style="padding:36px 40px 24px;text-align:center;border-bottom:3px double #0f172a;">
          <p style="margin:0 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;letter-spacing:0.02em;color:#0f172a;line-height:1.2;">
            {{vars.publication.title}}
          </p>
          <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:13px;font-style:italic;color:#64748b;line-height:1.4;">
            {{vars.publication.issue_meta}}
          </p>
        </td></tr>
        <tr><td style="padding:36px 40px;font-family:Georgia,'Times New Roman',serif;color:#1e293b;font-size:16px;line-height:1.75;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:28px 40px;text-align:center;font-size:12px;color:#64748b;line-height:1.6;border-top:1px solid #e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 12px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:13px;font-weight:600;color:#334155;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 10px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 14px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#64748b;text-decoration:underline;">Unsubscribe</a>
              from this type of email.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: publication.title
      type: text
      label: Publication title
      required: true
      defaultFrom: compliance.organizationName
    - key: publication.issue_meta
      type: text
      label: Issue or date line
      description: Shown under the masthead (e.g. Issue #12 · September 2026).
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the footer. Uses the Relaybase icon when unset.
