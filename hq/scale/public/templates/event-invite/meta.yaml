id: tpl-event-invite
name: Event Invite
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
    <tr><td align="center" style="padding:32px 16px 44px;">
      <table role="presentation" width="580" cellpadding="0" cellspacing="0" style="max-width:580px;width:100%;background:#ffffff;">
        <tr><td style="padding:0 0 14px;">
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:middle;padding-right:10px;line-height:0;font-size:0;">
                {{vars.host.avatar}}
              </td>
              <td style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;font-weight:500;color:#52525b;line-height:1.2;">
                {{vars.host.name}}
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 0 6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;color:#71717a;line-height:1.3;">
          {{vars.invite.kicker}}
        </td></tr>
        <tr><td style="padding:0 0 18px;">
          <h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.02em;text-transform:uppercase;color:#09090b;line-height:1.3;">
            {{vars.invite.title}}
          </h1>
        </td></tr>
        <tr><td style="padding:0;border-top:1px solid #e4e4e7;"></td></tr>
        <tr><td style="padding:18px 0 14px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:top;width:48px;padding-right:14px;">
                <table role="presentation" width="48" cellpadding="0" cellspacing="0" style="width:48px;border:1px solid #e4e4e7;border-radius:8px;overflow:hidden;text-align:center;background:#ffffff;">
                  <tr><td style="padding:3px 2px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#71717a;border-bottom:1px solid #e4e4e7;line-height:1;">
                    {{vars.invite.month}}
                  </td></tr>
                  <tr><td style="padding:6px 2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;font-weight:700;color:#18181b;line-height:1;">
                    {{vars.invite.day}}
                  </td></tr>
                </table>
              </td>
              <td style="vertical-align:middle;">
                <p style="margin:0 0 3px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;font-weight:600;color:#18181b;line-height:1.25;">
                  {{vars.invite.date_title}}
                </p>
                <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:#71717a;line-height:1.35;">
                  {{vars.invite.time_details}}
                </p>
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 0 18px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:top;width:48px;padding-right:14px;">
                <table role="presentation" width="48" cellpadding="0" cellspacing="0" style="width:48px;height:44px;border:1px solid #e4e4e7;border-radius:8px;text-align:center;background:#ffffff;">
                  <tr><td style="padding:10px 0;font-size:16px;line-height:1;color:#71717a;">
                    📍
                  </td></tr>
                </table>
              </td>
              <td style="vertical-align:middle;">
                <p style="margin:0 0 3px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;font-weight:600;color:#18181b;line-height:1.25;">
                  {{vars.invite.location_name}}
                </p>
                <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:#71717a;line-height:1.35;">
                  {{vars.invite.location_address}}
                </p>
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:0;border-top:1px solid #e4e4e7;"></td></tr>
        <tr><td style="padding:24px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;color:#18181b;font-size:15px;line-height:1.7;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:24px 0 0;text-align:center;font-size:12px;color:#71717a;line-height:1.6;border-top:1px solid #e4e4e7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 10px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:13px;font-weight:600;color:#3f3f46;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 8px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 10px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#71717a;text-decoration:underline;">Unsubscribe</a>
              from event invitations.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: invite.title
      type: text
      label: Event title
      required: true
      defaultFrom: compliance.organizationName
      description: Main headline of the event in uppercase.
    - key: invite.kicker
      type: text
      label: Top kicker line
      description: Subtitle above the event title (e.g. You're invited to).
    - key: host.name
      type: text
      label: Host name
      description: Name of the event host.
    - key: host.avatar
      type: image
      label: Host avatar
      description: Circular photo next to the host name.
    - key: invite.month
      type: text
      label: Date badge month
      description: Short month abbreviation (e.g. AUG, SEP, OCT).
    - key: invite.day
      type: text
      label: Date badge day
      description: Day number (e.g. 24, 05, 18).
    - key: invite.date_title
      type: text
      label: Date headline
      description: Full date text (e.g. Monday, August 24).
    - key: invite.time_details
      type: text
      label: Time details
      description: Time window and timezone (e.g. 9:00 AM - 9:30 PM PDT).
    - key: invite.location_name
      type: text
      label: Venue name
      description: Event venue or host location (e.g. Hwy17 Studios ↗).
    - key: invite.location_address
      type: text
      label: Venue address
      description: City, state or full street address (e.g. Santa Cruz, CA).
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the footer. Uses the Relaybase icon when unset.
