id: tpl-product-launch
name: Product Launch
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;">
    <tr><td align="center" style="padding:40px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;">
        <tr>
          <td align="center" style="padding:0;line-height:0;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);min-height:160px;">
            {{vars.hero.image}}
          </td>
        </tr>
        <tr><td style="padding:36px 32px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a;font-size:15px;line-height:1.65;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:20px 32px 32px;text-align:center;font-size:12px;color:#64748b;line-height:1.6;border-top:1px solid #e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 12px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:13px;font-weight:600;color:#334155;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 10px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 14px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#64748b;text-decoration:underline;">Unsubscribe</a>
              from this type of email.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: hero.image
      type: image
      label: Hero banner
      description: Full-width image above the body. Gradient shows when unset.
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the footer. Uses the Relaybase icon when unset.
