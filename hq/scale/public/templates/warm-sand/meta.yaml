id: tpl-warm-sand
name: Warm Sand
html: |
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f5f0;">
    <tr><td align="center" style="padding:40px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e8e4dc;border-radius:16px;">
        <tr><td style="padding:28px 32px 8px;border-bottom:1px solid #efeae2;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="vertical-align:middle;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td data-scale-header-logo="1" style="vertical-align:middle;padding-right:10px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                    <td style="vertical-align:middle;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:600;color:#1f1e1d;line-height:1.3;">
                      {{vars.brand.organization_name}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr><td style="padding-top:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:#78716c;line-height:1.4;">
              {{vars.header.greeting_tag}}
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#3b3a36;font-size:15px;line-height:1.7;">
          {{content}}
        </td></tr>
        <tr>
          <td style="padding:28px 32px;text-align:center;font-size:12px;color:#78716c;line-height:1.6;border-top:1px solid #efeae2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 12px;">
              <tr>
                <td data-crm-footer-logo="1" style="vertical-align:middle;padding-right:8px;line-height:0;font-size:0;">{{vars.brand.logo}}</td>
                <td style="vertical-align:middle;font-size:13px;font-weight:600;color:#57534e;line-height:1.3;text-align:left;">{{vars.brand.organization_name}}</td>
              </tr>
            </table>
            <p style="margin:0 0 10px;white-space:pre-line;">{{postal_address}}</p>
            <p style="margin:0 0 14px;">{{compliance_contact_email}}</p>
            <p style="margin:0;">
              <a href="{{unsubscribe_url}}" style="color:#78716c;text-decoration:underline;">Unsubscribe</a>
              from this type of email.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
variables:
  fields:
    - key: brand.organization_name
      type: text
      label: Organization name
      required: true
      defaultFrom: compliance.organizationName
    - key: brand.logo
      type: image
      label: Logo
      required: true
      description: Shown in the header and footer. Uses the Relaybase icon when unset.
    - key: header.greeting_tag
      type: text
      label: Greeting line
      description: Subtitle under the header (e.g. Community letter, Welcome aboard).
